version: "3"

vars:
  NAMESPACE: lightrag-stack
  # Colima profile `-p k3s` → kubectl context is usually `colima-k3s` (override with `task ... CONTEXT=other`).
  CONTEXT: colima-k3s
  REPO_ROOT:
    sh: git rev-parse --show-toplevel
  KUBECTL:
    sh: |
      if [ -n "{{.CONTEXT}}" ]; then
        echo "kubectl --context={{.CONTEXT}}"
      else
        echo "kubectl"
      fi

tasks:
  default:
    desc: List Taskfile tasks
    cmds:
      - task --list

  secrets:sync:
    desc: Archive existing deploy/lightrag.env, copy fresh from example, render Secret lightrag-env
    cmds:
      - |
        set -euo pipefail
        EXAMPLE="{{.REPO_ROOT}}/deploy/lightrag.env.example"
        TARGET="{{.REPO_ROOT}}/deploy/lightrag.env"
        ARCHIVE_DIR="{{.REPO_ROOT}}/deploy/.archived"
        if [ -f "$TARGET" ]; then
          mkdir -p "$ARCHIVE_DIR"
          stamp="$(date +%Y%m%d-%H%M%S)"
          mv "$TARGET" "$ARCHIVE_DIR/lightrag.env.${stamp}"
          echo "Archived previous deploy/lightrag.env to deploy/.archived/lightrag.env.${stamp}" >&2
        fi
        cp "$EXAMPLE" "$TARGET"
        echo "Wrote $TARGET from deploy/lightrag.env.example — edit before production if needed." >&2
      - 'bash "{{.REPO_ROOT}}/scripts/render-lightrag-secret.sh" "{{.REPO_ROOT}}/deploy/lightrag.env" "{{.REPO_ROOT}}/k8s/generated/lightrag-env-secret.yaml"'
    requires:
      vars: [REPO_ROOT]

  k8s:apply:
    desc: Apply namespace + workloads (expects k8s/generated/lightrag-env-secret.yaml)
    cmds:
      - |
        set -euo pipefail
        EXAMPLE="{{.REPO_ROOT}}/k8s/open-webui-secrets.example.yaml"
        TARGET="{{.REPO_ROOT}}/k8s/open-webui-secrets.yaml"
        if [ ! -f "$TARGET" ]; then
          cp "$EXAMPLE" "$TARGET"
          echo "Created $TARGET from open-webui-secrets.example.yaml — set webui-secret-key and admin password before production use." >&2
        fi
      - '{{.KUBECTL}} apply -f "{{.REPO_ROOT}}/k8s/namespace.yaml"'
      - '{{.KUBECTL}} apply -f "{{.REPO_ROOT}}/k8s/generated/lightrag-env-secret.yaml"'
      - '{{.KUBECTL}} apply -f "{{.REPO_ROOT}}/k8s/lightrag.yaml"'
      - '{{.KUBECTL}} apply -f "{{.REPO_ROOT}}/k8s/open-webui-secrets.yaml"'
      - '{{.KUBECTL}} apply -f "{{.REPO_ROOT}}/k8s/open-webui.yaml"'
    requires:
      vars: [REPO_ROOT]

  infra:start:
    desc: Sync secrets and apply the full stack
    cmds:
      - task secrets:sync
      - task k8s:apply
      - task infra:wait

  infra:wait:
    desc: Wait for core deployments to become available
    cmds:
      - '{{.KUBECTL}} -n "{{.NAMESPACE}}" rollout status deployment/lightrag --timeout=15m'
      - '{{.KUBECTL}} -n "{{.NAMESPACE}}" rollout status deployment/open-webui --timeout=15m'

  models:pull:
    desc: Pull Ollama models on the Mac host (native Metal) using LLM_MODEL and EMBEDDING_MODEL from deploy/lightrag.env
    cmds:
      - 'bash "{{.REPO_ROOT}}/scripts/host-ollama-pull.sh" "{{.REPO_ROOT}}/deploy/lightrag.env"'

  port-forward:
    desc: Port-forward LightRAG and Open WebUI to localhost (Ollama stays on the host)
    cmds:
      - 'bash "{{.REPO_ROOT}}/scripts/port-forward.sh" "{{.CONTEXT}}" "{{.NAMESPACE}}"'

  import:file:
    desc: "Import a file into LightRAG (usage: task import:file FILE=./doc.txt)"
    cmds:
      - |
        set -euo pipefail
        if [ -z "${FILE:-}" ]; then
          echo "FILE is required (example: task import:file FILE=./notes.txt)" >&2
          exit 1
        fi
        LIGHTRAG_URL="${LIGHTRAG_URL:-http://127.0.0.1:9621}"
        curl -fsS -X POST "${LIGHTRAG_URL}/documents/upload" -F "file=@${FILE}"

  e2e:
    desc: Run end-to-end checks (expects port-forwards or direct cluster access)
    cmds:
      - 'bash "{{.REPO_ROOT}}/scripts/e2e.sh"'

  e2e:k8s:
    desc: Port-forward in the background, run e2e, then stop port-forwards
    cmds:
      - 'bash "{{.REPO_ROOT}}/scripts/e2e-k8s.sh" "{{.CONTEXT}}" "{{.NAMESPACE}}"'

  infra:stop:
    desc: Delete the stack namespace (destructive)
    cmds:
      - '{{.KUBECTL}} delete namespace "{{.NAMESPACE}}" --ignore-not-found=true'
